server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow up to 20 MB uploads (multer cap is 10 MB, this gives headroom)
    client_max_body_size 20M;

    location /api {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Long timeout for PDF embedding (can take 2-3 min for large files)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # nginx:alpine omits .mjs from mime.types; without this the pdfjs worker
    # gets served as application/octet-stream, which browsers reject for modules
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

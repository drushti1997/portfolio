version: '3.9'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: portfolio_client
    ports:
      - '80:80'
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - portfolio_net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: portfolio_server
    environment:
      PORT: 5000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      POSTGRES_URL: postgresql://portfolio_user:${POSTGRES_PASSWORD}@postgres:5432/portfolio
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - '5000'
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - portfolio_net

  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    networks:
      - portfolio_net

volumes:
  pg_data:
    driver: local

networks:
  portfolio_net:
    driver: bridge

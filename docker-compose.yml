version: '3.9'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: drish_portfolio_client
    ports:
      - '127.0.0.1:8081:80'
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - portfolio_net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: drish_portfolio_server
    environment:
      PORT: 3001
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    expose:
      - '3001'
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - portfolio_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: drish_portfolio_postgres
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    networks:
      - portfolio_net

volumes:
  pg_data:
    driver: local
  uploads_data:
    driver: local

networks:
  portfolio_net:
    driver: bridge
